  name: jk-bms 
  bms0: "${name} 55Ah"
  bms1: "batterie vélo"
  GTN:  "Onduleur Soyosource"
  emerson_r48 : "emerson_r48"
  digipot: "digipot"
  device_description: "Monitor and control a JK-BMS via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  mac_address: 20:22:08:25:1F:8F
  external_components_source_1: github://syssi/esphome-jbd-bms@main
  external_components_source_2: github://syssi/esphome-soyosource-gtn-virtual-meter@main
