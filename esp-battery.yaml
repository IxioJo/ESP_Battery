    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(http_error_count);

  - platform: template
    name: "HTTP Taux de succès"
    id: http_success_rate
    icon: mdi:percent
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      int total = id(http_success_count) + id(http_error_count);
      if (total == 0) return 0.0;
      return (float)id(http_success_count) / total * 100.0;

  # Sensor pour afficher le délai actuel en secondes (plus lisible)
  - platform: template
    name: "Fréquence actualisation"
    id: http_polling_frequency
    icon: mdi:sync
    unit_of_measurement: "Hz"
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      float interval_ms = id(http_polling_interval).state;
      if (interval_ms > 0) {
        return 1000.0 / interval_ms;  // Convertir ms en Hz
      }
      return 0.0;      


