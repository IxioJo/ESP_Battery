  external_components_source_4: http://github.com/IxioJo/esphome-emerson-vertiv-r48
  
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  protocol_version: JK02_32S
  mac_address_1: A5:C2:37:28:A3:70

  tx_pin_GTN:   GPIO1
  rx_pin_GTN:   GPIO8
  spi_clk_pin:  GPIO07
  spi_mosi_pin: GPIO06
  spi_miso_pin: GPIO05
  spi_CS_pin:   GPIO15
  spi_CS_pin_2: GPIO10
  switch1_pin:  GPIO04
  i2c_sda_pin:  GPIO17
  i2c_scl_pin:  GPIO18


  minipid_id : minipid_GTN
  minipid_name : minipid_GTN
  minipid_id2 : minipid_Emerson
  minipid_name2 : minipid_Emerson
 





