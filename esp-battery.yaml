      name: ${emerson_r48}_DC max current
      unit_of_measurement: '%'    
      device_id: Emerson



  - platform: ina226
    address: 0x50
    shunt_resistance: 0.001470 ohm
    max_current: 50A
    # adc time used for both, Bus Voltage and Shunt Voltage
    adc_time: 332us
    adc_averaging: 64
    update_interval: 1s
    i2c_id: bus_a

    current:
      name: "INA226 Current"
      device_id: ina
      device_class: current
      state_class: measurement
      id: ina_current
      filters:
        - offset: !lambda return id(current_offset).state;
    power:
      name: "INA226 Power"
      id: ina_power
      device_id: ina
      device_class: power
      state_class: measurement
      filters:
       - multiply: 2.014
    bus_voltage:
      name: "INA226 Bus Voltage"
      device_id: ina
      device_class: voltage
      state_class: measurement
      filters:
       - multiply: 2.014
      id: ina_voltage 
    shunt_voltage:
      name: "INA226 Shunt Voltage"
      device_id: ina
      unit_of_measurement: mV
      accuracy_decimals: 3
      filters:
       - lambda: return x*1000;


  - platform: integration
    name: AH Data
    device_id: ina
    id: ina_ah
    sensor: ina_current
    time_unit: h
    restore: true
    unit_of_measurement: Ah
    integration_method: right
    accuracy_decimals: 3
    filters:
     - lambda: return x + 50;
    disabled_by_default: true
    internal: true
# Getting AH
  - platform: template
    name: Battery Capacity
    device_id: ina
    unit_of_measurement: Ah
    device_class: energy_storage
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      return (id(ina_ah).state * 1);
    update_interval: 2s          
    on_value_range:
        - above: 50.025
          then:
           - delay: 10s
           - lambda: |-
                ESP_LOGI("update_lost_ah", "lost_ah = %f", id(ina_lost_ah));
                id(ina_lost_ah) += id(ina_ah).state - 50.0;
                
           - sensor.integration.reset: ina_ah


  - platform: template
    name: inPower
    device_id: ina
    id: ina_inpower
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    update_interval: 1s 
    accuracy_decimals: 2
    lambda: |-
      if(id(ina_current).state>0) { return ( id(ina_current).state * id(ina_voltage).state ); } 
      else {return 0;}

  - platform: template
    name: outPower
    device_id: ina
    id: ina_outpower
    unit_of_measurement: W
    state_class: measurement
    device_class: power
    update_interval: 1s 
    accuracy_decimals: 2
    lambda: |-
      if(id(ina_current).state<0) { return ( id(ina_current).state * id(ina_voltage).state *-1 ); } 
      else {return 0;}     
    
  - platform: template
    name: Lost Current
    device_id: ina
    id: ina_lost_current
    unit_of_measurement: Ah
    device_class: energy_storage
    state_class: total_increasing
    update_interval: 10s
    accuracy_decimals: 3
    lambda: |-
      return id(ina_lost_ah);
    

  - platform: integration
