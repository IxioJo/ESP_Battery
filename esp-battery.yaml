esphome:
  name: esp-batterie
  friendly_name: ESP Batterie
  comment: ${device_description}



 
 # includes:
 # - CustomDigipotOutput.h
 # Define devices
  devices:
  - id: JKBMS_55Ah
    name: "JK BMS 55Ah"

  - id: JBD_BMS
    name: "BMS JBD Vélo"    

  - id: Emerson
    name: "Emerson R48 Battery Chargeur"

  - id: Soyosource
    name: "Soyosource GTN1200 Inverter"      
  - id: ina 
    name: "Battery Shunt"   

  - id: powermeter
    name: "Power Meter"  




  min_version: 2024.6.0
  project:
    name: "syssi.esphome-jk-bms"
    version: 2.1.0  




  on_boot:
    
    priority: -100
    then:
      - lambda: |-
          #include "esp_http_client.h"
          
          xTaskCreatePinnedToCore(
            [](void *pvParameters) {
              ESP_LOGI("http_task", "Démarrage sur core %d", xPortGetCoreID());
              
              // Configuration du client HTTP avec keep-alive
              esp_http_client_config_t config = {};
              config.url = "http://192.168.1.xxx/status.xml";
              config.timeout_ms = 2000;
              config.keep_alive_enable = true;
              config.keep_alive_idle = 5;
              config.keep_alive_interval = 5;
              config.keep_alive_count = 3;
              
              esp_http_client_handle_t client = esp_http_client_init(&config);
              
              char buffer[2048];
              float last_power   = -999.0;
              float last_panel   = -999.0;
              float last_routage = -999.0;
              
              while(true) {
                // Récupérer le délai dynamiquement
                int delay_ms = (int)id(http_polling_interval).state;
                if (delay_ms < 100) delay_ms = 100;  // Sécurité: minimum 100ms
                
                // Vérifier si la collecte est activée
                if (id(http_task_enabled)) {
                  uint32_t start = millis();
                  
                  esp_err_t err = esp_http_client_open(client, 0);
                  if (err == ESP_OK) {
                    int content_length = esp_http_client_fetch_headers(client);
                    int total_read = 0;
                    
                    if (content_length > 0 && content_length < sizeof(buffer)) {
                      total_read = esp_http_client_read(client, buffer, content_length);
                      buffer[total_read] = '\0';
                      
                      if (total_read > 0) {
                        std::string data(buffer, total_read);
                        
                        // Parser le XML
                        size_t start_pos = data.find("<inAns>");
                        if (start_pos != std::string::npos) {
                          start_pos += 7;
                          size_t end_pos = data.find("<", start_pos);
                          std::string inAns_content = data.substr(start_pos, end_pos - start_pos);
                          
                          // Extraire les valeurs
                          size_t first_semi = inAns_content.find(";");
                          if (first_semi != std::string::npos) {
                            std::string val1_str = inAns_content.substr(0, first_semi);
                            std::replace(val1_str.begin(), val1_str.end(), ',', '.');
                            
                            size_t second_semi = inAns_content.find(";", first_semi + 1);
                            if (second_semi != std::string::npos) {
                              std::string val2_str = inAns_content.substr(first_semi + 1, second_semi - first_semi - 1);
                              std::replace(val2_str.begin(), val2_str.end(), ',', '.');

                              size_t third_semi = inAns_content.find(";", second_semi + 1);
                              if (third_semi != std::string::npos) {
                                std::string val3_str = inAns_content.substr(second_semi + 1, third_semi - second_semi - 1);
                                std::replace(val3_str.begin(), val3_str.end(), ',', '.');
                                
                                // Mise à jour thread-safe des globales
                                float power = atof(val1_str.c_str());
                                float panel = atof(val2_str.c_str());
                                float routage = atof(val3_str.c_str());
                                float power_charger;
                                float power_GTN;
                                int t = 0;

                                // Mettre à jour seulement si changement > 0.5W
                                if (fabs(power - last_power) > 0.5) {
                                  id(latest_power) = power;
                                  last_power = power;
                                  id(consommation_maison).publish_state(power);
                                  
                                  if (power < 20.0 && power > -20.0 && routage < 290.0) {
                                    // Ne rien faire dans ce cas
                                  } 
                                  else {
                                    power_charger = power;
                                    id(minipid_Emerson_input_smoothed).publish_state(power_charger);
                                  }

                                  power_GTN = power - routage * 6.87;
                                  id(minipid_GTN_input_smoothed).publish_state(power_GTN);
                                  t = 1;
                                }
                                
                                if (fabs(panel - last_panel) > 0.5) {
                                  id(latest_panel) = panel;
                                  last_panel = panel;
                                  id(puissance_panneau).publish_state(panel);
                                }

                                if (fabs(routage - last_routage) > 0.5) {
                                  id(latest_routage) = routage;
                                  last_routage = routage;
                                  id(routage_cumulus).publish_state(routage);

                                  if (power < 20.0 && power > -20.0 && routage < 290.0) {
                                    power_charger = (100 - routage * 6.87);
                                    id(minipid_Emerson_input_smoothed).publish_state(power_charger);
                                  } 

                                  if (t == 0) {
                                    power_GTN = power - routage * 6.87;
                                    id(minipid_GTN_input_smoothed).publish_state(power_GTN);
                                  }
                                }
                                
                                // Incrémenter le compteur de succès
                                id(http_success_count)++;
                                
                                ESP_LOGD("http_task", "Power: %.1f W, Panel: %.1f W, Routage: %.1f W (en %d ms, délai: %d ms)", 
                                        power, panel, routage, millis() - start, delay_ms);
                              }
                            }
                          }
                        }
                      }
                    }
                    esp_http_client_close(client);
                  } else {
                    ESP_LOGW("http_task", "Erreur connexion HTTP: %s", esp_err_to_name(err));
                    id(http_error_count)++;
                  }
                } else {
                  ESP_LOGD("http_task", "Collecte désactivée - en attente");
                }
                
                // Attendre le délai configuré dynamiquement
                vTaskDelay(delay_ms / portTICK_PERIOD_MS);
              }
              
              esp_http_client_cleanup(client);
            },
            "HTTP_Task",
            8192,
            NULL,
            0,
            NULL,
            0  // Core 0
          );
          
          ESP_LOGI("main", "Tâche HTTP créée sur core 0 avec délai variable");

      - script.execute: check_for_sleep_prevention      
      
      - delay: 100ms
      - logger.log: "Initialisation terminée, démarrage du bus CAN"

      - number.set:
          id:  ${emerson_r48}_set_output_voltage
          value: 56.6

      - number.set:
          id:  ${emerson_r48}_set_output_max_current
          value: 10

      - number.set:
          id:  ${emerson_r48}_set_input_current
          value: 6  
      - switch.turn_on:                             
          id:  ${emerson_r48}_ac_sw
      - switch.turn_on:                             
          id:  ${emerson_r48}_dc_sw
      - delay: 5s   # laisse le temps au capteur `ah` de restaurer sa valeur
      - lambda: |-
            if (id(ina_ah).state > 50.025) {
              id(ina_lost_ah) += id(ina_ah).state - 50.0;
              ESP_LOGI("init_check", "Valeur AH au démarrage au-dessus de 50Ah, correction appliquée.");
              id(ina_ah).reset();
            }                          

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 16MB
  partitions: partitions.csv
  framework:
    type: esp-idf
    version: recommended

logger:
#  level: VERBOSE

psram:
  mode: octal
  speed: 80MHz


# Ajustements de partition pour profiter des 16Mo
esp32_improv:
  authorizer: none



debug:
  update_interval: 5s


globals:
  - id: ina_lost_ah
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: power_value
    type: float
    restore_value: no
    initial_value: '0.0'    
  - id: latest_power
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: latest_panel
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: latest_routage
    type: float
    restore_value: no
    initial_value: '0.0'    
  - id: http_task_enabled
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: http_success_count
    type: int
    restore_value: no
    initial_value: '0'
  - id: http_error_count
    type: int
    restore_value: no
    initial_value: '0'    
  
    



