# I/O
light:
  - platform: esp32_rmt_led_strip
    id: sleep_on_light 
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
  
    chipset: ws2812
    name: "Sleep On Light"
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.05s
          update_interval: 0.05s
          min_brightness: 0%
          max_brightness: 10%

script:
  - id: check_for_sleep_prevention
    mode: queued
    then:
      - if:
          condition:
            binary_sensor.is_off: esp_batterie_sleep_mode
          then:
            - light.turn_on:
                id: sleep_on_light
                red: 000%
                blue: 100%
                green: 0%
                effect: "Fast Pulse"

          
            - deep_sleep.prevent: deep_sleep_control
            - logger.log: 'Sleep Mode OFF'
            

          else:
            - light.turn_off:
                id: sleep_on_light

            - delay: 5s                
            - deep_sleep.allow: deep_sleep_control
            - logger.log: "Sleep Mode ON"
            
      - delay: 5s
      - script.execute: check_for_sleep_prevention     


deep_sleep:
  id: deep_sleep_control
  run_duration: 30s
  sleep_duration: 1800s        
